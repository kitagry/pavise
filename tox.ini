[tox]
envlist = py{310,311,312,313,314}-{pandas,polars,all},lint,type
isolated_build = true

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pandas: pandas>=2.2.0
    polars: polars>=1.0.0
    all: pandas>=2.2.0
    all: polars>=1.0.0
    all: pyarrow>=10.0.0
commands =
    pandas: pytest tests/test_pandas/ -v
    polars: pytest tests/test_polars/ -v
    all: pytest tests/ -v

[testenv:lint]
skip_install = true
allowlist_externals = uv
commands =
    uv run ruff check
    uv run ruff format --check

[testenv:type]
skip_install = true
allowlist_externals = uv
commands =
    uv run pyright
